function checkEnd(){if(ended||!started)return;const m=MD(),oth=online?rem:bots;let w={n:T[S.lang].you,k:kills};for(const o of oth)if(o.k>w.k)w={n:o.name,k:o.k};
 if((m.kl&&w.k>=m.kl)||(m.tl&&tleft<=0)){ended=true;fire=false;$("msg").textContent="🏆 "+w.n+" "+T[S.lang].win;setTimeout(newMatch,6000)}}
async function goOnline(){const st=$("ost"),t=T[S.lang];
 if(maintOn){st.textContent=t.maint;return}
 st.textContent=t.conn;
 const code=($("rc").value||"lobby").toLowerCase().replace(/[^a-z0-9_.-]/g,"").replace(/^[^a-z0-9]+/,"").slice(0,40)||"lobby";
 try{RM=await connectRoom(code)}catch(e){st.textContent=e&&e.message==="maintenance"?t.maint:e&&e.message==="full"?t.full:t.onfail;return}
 online=true;bots.forEach(b=>sc.remove(b.g));bots.length=0;kills=0;deaths=0;ended=false;st.textContent="";
 if(started){newMatch();run=true;showScr(null)}else $("play").click()}
function showScr(id){["mainm","menu","onp"].forEach(i=>$(i).style.display=i===id?"flex":"none")}
function pause(){run=false;showScr("mainm");$("play").textContent=T[S.lang].resume;fire=false}
$("bp").onclick=()=>{if(!editing&&run)pause()};
$("play").onclick=()=>{
 if(!started){started=true;tleft=MD().tl||0;for(let i=0;i<(online?0:7);i++){const b=mkBot(NAMES[Math.random()*NAMES.length|0]+(Math.random()<.4?"":(Math.random()*90|0)));bots.push(b);respawn(b)}respawnP()}
 run=true;showScr(null);if(!("ontouchstart" in window))try{cv.requestPointerLock()}catch(e){}};
// ---- online through your game server (WebSocket relay) ----
let curWs=null,maintOn=false;
function connectRoom(code){return new Promise((resolve,reject)=>{
 let ws,id=null,peers=[],mine={},done=false,tm=null;
 const fail=e=>{if(done)return;done=true;clearTimeout(tm);try{ws.close()}catch(x){}reject(new Error(e))};
 tm=setTimeout(()=>fail("timeout"),45000);
 try{ws=new WebSocket(SERVER_URL)}catch(e){fail("conn");return}
 const room={presence:o=>{mine=o;if(ws.readyState===1)ws.send(JSON.stringify({type:"pres",p:o}));return Promise.resolve()},
  peers:()=>[{isMe:true,sameTab:true,kind:"viewer",peer:id,presence:mine}].concat(peers.filter(q=>q.peer!==id).map(q=>({isMe:false,sameTab:false,kind:"viewer",peer:q.peer,presence:q.p})))};
 ws.onopen=()=>ws.send(JSON.stringify({type:"join",room:code,name:S.nick}));
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(x){return}
  if(m.type==="joined"){if(done)return;done=true;clearTimeout(tm);id=m.id;curWs=ws;resolve(room)}
  else if(m.type==="peers"){peers=m.list||[]}
  else if(m.type==="maintenance"){if(!done)fail("maintenance");else setMaint(true)}
  else if(m.type==="full"){fail("full")}
  else if(m.type==="kicked"){dropOnline(T[S.lang].kicked)}};
 ws.onclose=()=>{if(!done)fail("conn");else if(online&&curWs===ws)dropOnline(maintOn?"":T[S.lang].lost)};
 ws.onerror=()=>{};
})}
// leave online mode and go back to playing against bots
function dropOnline(msg){
 if(!online)return;
 online=false;RM=null;rem.length=0;
 try{if(curWs)curWs.close()}catch(e){}curWs=null;
 for(const id in RA){sc.remove(RA[id].g);delete RA[id]}
 if(started){for(let i=0;i<7;i++)bots.push(mkBot(NAMES[Math.random()*NAMES.length|0]+(Math.random()<.4?"":(Math.random()*90|0))));newMatch();run=false;fire=false;try{document.exitPointerLock()}catch(e){}}
 $("ost").textContent=msg||"";showScr("onp")}
// maintenance lock: covers the whole game while you have maintenance ON
function setMaint(on){
 if(on===maintOn)return;maintOn=on;
 $("maintov").style.display=on?"flex":"none";
 if(on){$("mt").textContent=T[S.lang].maint;run=false;fire=false;try{document.exitPointerLock()}catch(e){}if(online)dropOnline("")}
 else if(started)pause()}
function chk(){fetch(HTTP_URL+"/status",{cache:"no-store"}).then(r=>r.json()).then(s=>setMaint(!!s.maintenance)).catch(()=>{})}
chk();setInterval(chk,15000);
let last=0;
function loop(t){requestAnimationFrame(loop);const md=1000/S.fps;if(t-last<md-2)return;const dt=Math.min((t-last)/1000,.05);last=t;if(run)update(dt);R.render(sc,cam);FC.n++;if(t-FC.t>=500){FC.v=Math.round(FC.n*1000/(t-FC.t));FC.n=0;FC.t=t;const f=$("fc");f.textContent="FPS "+FC.v;f.style.color=FC.v>=S.fps*.9?"#7dffb0":FC.v>=S.fps*.6?"#ffd23c":"#ff6b6b"}}
apply();cam.position.copy(P);requestAnimationFrame(loop);
</script></body></html>
